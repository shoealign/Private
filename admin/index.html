<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리뷰 관리자 | MELLO</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/assets/runficial.css"></head><body><main class="rf-wrap"><small>MELLO / ADMIN</small><h1>리뷰 관리</h1><p>승인된 관리자만 리뷰를 등록·수정·삭제할 수 있습니다. 원문 링크를 반드시 기재하세요.</p><div id="status"></div><form id="login" class="rf-form"><label>관리자 이메일<input name="email" type="email" required></label><label>비밀번호<input name="password" type="password" required></label><button>로그인</button></form><section id="panel" hidden><p><button id="logout" class="rf-button">로그아웃</button></p><form id="edit" class="rf-form"><input type="hidden" name="id"><label>신발 모델 *<select name="shoe_slug" id="shoes" required></select></label><label>출처명 *<input name="source_name" required maxlength="120" placeholder="예: 매체명 / 블로그명"></label><label>원문 URL *<input name="source_url" type="url" required placeholder="https://..."></label><label>리뷰 제목 *<input name="review_title" required maxlength="200"></label><label>자체 요약 *<textarea name="summary" rows="5" required maxlength="2500" placeholder="원문을 복사하지 말고 직접 요약하세요."></textarea></label><label>원문 평점 (선택, 0~5)<input name="rating" type="number" min="0" max="5" step="0.1"></label><label>리뷰 게시일 (선택)<input name="review_date" type="date"></label><label><span>공개 여부</span><select name="published"><option value="false">비공개 초안</option><option value="true">공개</option></select></label><button>리뷰 저장</button><button type="button" id="reset" class="rf-button">새 리뷰 작성</button></form><h2>등록된 리뷰</h2><div id="items"></div></section></main><script src="/assets/shoes.js"></script><script src="/assets/runficial-config.js"></script><script src="/assets/runficial.js"></script><script>
(()=>{'use strict';const s=document.getElementById('status'),login=document.getElementById('login'),panel=document.getElementById('panel'),form=document.getElementById('edit'),items=document.getElementById('items');let token='',records=[];const shoes=window.SHOES||[];document.getElementById('shoes').innerHTML='<option value="">선택하세요</option>'+shoes.map(x=>'<option value="'+rf.esc(x.slug)+'">'+rf.esc(x.brand+' '+x.name)+'</option>').join('');
const message=x=>s.textContent=x;async function auth(email,password){const r=await fetch(rf.cfg.supabaseUrl.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:rf.cfg.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||d.error||'로그인 실패');return d.access_token}
async function request(path,method='GET',data){const r=await fetch(rf.cfg.supabaseUrl.replace(/\/$/,'')+'/rest/v1/'+path,{method,headers:{apikey:rf.cfg.supabaseAnonKey,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=representation'},...(data?{body:JSON.stringify(data)}:{})});if(!r.ok){const d=await r.text();throw Error('저장/조회 실패 '+r.status+' '+d.slice(0,180))}return r.status===204?[]:r.json()}
async function refresh(){records=await request('shoe_reviews?select=*&order=created_at.desc&limit=300');items.innerHTML=records.length?'<table class="rf-table"><thead><tr><th>모델</th><th>출처</th><th>상태</th><th>작업</th></tr></thead><tbody>'+records.map(x=>'<tr><td>'+rf.esc(x.shoe_name)+'</td><td>'+rf.esc(x.source_name)+'</td><td>'+(x.published?'공개':'초안')+'</td><td><button type="button" data-edit="'+x.id+'">수정</button> <button type="button" data-delete="'+x.id+'">삭제</button></td></tr>').join('')+'</tbody></table>':'<p>등록된 리뷰가 없습니다.</p>'}
login.addEventListener('submit',async e=>{e.preventDefault();if(!rf.ready){message('먼저 assets/runficial-config.js에 Supabase 설정을 입력하세요.');return}try{token=await auth(login.elements.email.value,login.elements.password.value);await refresh();login.hidden=true;panel.hidden=false;message('관리자 로그인 완료')}catch(err){token='';message(err.message)}});
form.addEventListener('submit',async e=>{e.preventDefault();try{const d=new FormData(form),slug=d.get('shoe_slug'),shoe=shoes.find(x=>x.slug===slug);if(!shoe)throw Error('모델을 선택하세요');const payload={shoe_slug:slug,shoe_name:shoe.name,source_name:d.get('source_name').trim(),source_url:d.get('source_url').trim(),review_title:d.get('review_title').trim(),summary:d.get('summary').trim(),rating:d.get('rating')===''?null:Number(d.get('rating')),review_date:d.get('review_date')||null,published:d.get('published')==='true'};const id=d.get('id');await request(id?'shoe_reviews?id=eq.'+id:'shoe_reviews',id?'PATCH':'POST',payload);form.reset();form.elements.id.value='';await refresh();message('저장 완료. 공개 리뷰는 사용자 화면에 반영됩니다.')}catch(err){message(err.message)}});
items.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.edit||b.dataset.delete,record=records.find(x=>x.id===id);if(!record)return;if(b.dataset.delete){if(!confirm('이 리뷰를 삭제할까요?'))return;try{await request('shoe_reviews?id=eq.'+id,'DELETE');await refresh();message('삭제 완료')}catch(err){message(err.message)}return}for(const k of ['id','shoe_slug','source_name','source_url','review_title','summary','rating','review_date','published'])if(form.elements[k])form.elements[k].value=record[k]===null?'':String(record[k]);window.scrollTo({top:0,behavior:'smooth'});message('수정 후 저장하세요.')});document.getElementById('reset').onclick=()=>{form.reset();form.elements.id.value=''};document.getElementById('logout').onclick=()=>{token='';login.hidden=false;panel.hidden=true;message('로그아웃했습니다.')}})();
</script></body></html>
