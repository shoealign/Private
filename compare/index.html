<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>러닝화 비교하기 | SHOELINEUP</title><link rel="stylesheet" href="/assets/detail.css"></head><body><header><div><a href="/" class="logo">SHOELINEUP</a><nav class="nav"><a href="/">전체 랭킹</a></nav></div></header><main><section class="box"><h1>러닝화 비교하기</h1><p class="muted">로그인 없이 최대 3개 러닝화를 비교할 수 있어요. 제품 상세에서 + 비교 목록에 담기를 눌러보세요.</p><div id="list"></div><div class="btns"><a class="btn" href="/?compare=1">비교표 열기 →</a><a class="btn light" href="/">제품 더 고르기</a><button class="btn light" onclick="localStorage.removeItem('shoelineup_compare_v1');location.reload()">선택 초기화</button></div></section></main><script src="/assets/shoes.js"></script><script>let a=[];try{a=JSON.parse(localStorage.getItem('shoelineup_compare_v1')||'[]')}catch(e){};document.getElementById('list').innerHTML=a.map(n=>{let s=shoes.find(x=>x.name===n);return s?'<div class="price"><span>'+s.brand+'</span><strong>'+s.name+'</strong></div>':''}).join('')||'<p>선택된 제품이 없습니다.</p>'</script></body></html>
