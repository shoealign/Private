<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BALBOLL 관리자</title><link rel="stylesheet" href="/assets/runficial.css"><style>body{background:#f5f6f5;color:#17231b;font-family:system-ui,sans-serif}.wrap{max-width:980px;margin:42px auto;padding:20px}.pane{background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px;margin:16px 0}input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:11px;margin:5px 0 14px;border:1px solid #bbc4bd;border-radius:7px}button{padding:10px 16px;background:#1f5134;color:white;border:0;border-radius:7px;cursor:pointer;margin:4px}button.secondary{background:#6a7570}button.danger{background:#9b2932}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.fields label.wide{grid-column:1/-1}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}#status{white-space:pre-wrap;color:#225b36;font-weight:600}@media(max-width:650px){.fields{grid-template-columns:1fr}.wrap{margin:0;padding:10px}}</style></head><body><main class="wrap"><a href="/">← 사이트로 돌아가기</a><h1>BALBOLL 관리자</h1><p>제품 이미지·평점·근거와 출처 리뷰를 관리합니다. 승인된 관리자 계정만 저장할 수 있습니다.</p><p id="status" role="status"></p><section id="loginBox" class="pane"><h2>관리자 로그인</h2><form id="login"><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section><section id="panel" hidden><button id="logout" class="secondary">로그아웃</button><section class="pane"><h2>제품 정보·평점 수정</h2><p>저장 후 공개하면 메인 랭킹에 반영됩니다. 점수는 출처를 검증한 경우에만 입력하세요. 이미지 URL은 HTTPS 주소를 사용합니다.</p><form id="shoeForm"><div class="fields"><label>제품<select name="slug" id="shoeSelect" required></select></label><label>표시 이름 (선택)<input name="name" maxlength="160"></label><label class="wide">이미지 URL<input name="image_url" type="url" placeholder="https://..."></label><label>발볼 설명<input name="width_feel" maxlength="80"></label><label>데일리<input name="daily" type="number" min="0" max="100" step="0.1"></label><label>장거리<input name="long_run" type="number" min="0" max="100" step="0.1"></label><label>템포런<input name="tempo" type="number" min="0" max="100" step="0.1"></label><label>쿠셔닝<input name="cushion" type="number" min="0" max="100" step="0.1"></label><label>안정성<input name="stability" type="number" min="0" max="100" step="0.1"></label><label class="wide">평가 근거 URL<input name="evidence_url" type="url" placeholder="https://runrepeat.com/..."></label><label class="wide">근거 요약<textarea name="evidence_note" rows="3"></textarea></label><label>상태<select name="published"><option value="false">비공개</option><option value="true">공개</option></select></label></div><button>제품 정보 저장</button><button type="button" class="danger" id="deleteShoe">수정 데이터 삭제</button></form></section><section class="pane"><h2>출처 리뷰 등록·관리</h2><form id="reviewForm"><input name="id" type="hidden"><div class="fields"><label>신발<select name="shoe_slug" id="reviewShoe" required></select></label><label>출처명<input name="source_name" required maxlength="120"></label><label class="wide">원문 URL<input name="source_url" type="url" required></label><label class="wide">리뷰 제목<input name="review_title" required maxlength="200"></label><label class="wide">자체 요약<textarea name="summary" required maxlength="2500"></textarea></label><label>원문 평점 (0~5, 선택)<input name="rating" type="number" min="0" max="5" step="0.1"></label><label>게시일<input name="review_date" type="date"></label><label>공개 여부<select name="published"><option value="false">비공개</option><option value="true">공개</option></select></label></div><button>리뷰 저장</button><button type="button" class="secondary" id="clearReview">새 리뷰</button></form><h3>등록된 리뷰</h3><div id="reviewItems"></div></section></section></main><script src="/assets/shoes.js"></script><script src="/assets/runficial-config.js"></script><script src="/assets/admin-v10.js"></script></body></html>
