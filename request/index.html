<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리뷰 요청 | MELLO</title><link rel="stylesheet" href="/assets/runficial.css"></head><body><main class="rf-wrap"><small>MELLO / REQUEST</small><h1>이 러닝화도 리뷰해 주세요.</h1><p>궁금한 러닝화를 알려주세요. 요청 내용을 이메일 앱으로 작성해 관리자에게 보낼 수 있습니다.</p><form id="request" class="rf-form"><label>브랜드 / 모델명 *<input name="shoe" maxlength="120" required placeholder="예: ASICS Novablast 5"></label><label>요청 내용 *<textarea name="reason" maxlength="1500" rows="5" required placeholder="궁금한 점이나 비교하고 싶은 모델을 적어주세요."></textarea></label><label>회신 이메일 (선택)<input name="reply" type="email" maxlength="180" placeholder="답변을 원하는 경우"></label><button>이메일 앱으로 요청 작성 ↗</button></form><p class="rf-muted">버튼을 누르면 기본 이메일 앱이 열립니다. 메일 앱에서 '보내기'를 눌러야 실제로 접수됩니다.</p><p><a href="/">← 러닝화 목록</a></p></main><script src="/assets/runficial-config.js"></script><script src="/assets/runficial.js"></script><script>
const f=document.getElementById('request');const q=new URLSearchParams(location.search).get('shoe');if(q)f.elements.shoe.value=q;
f.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(f),to=rf.cfg.requestEmail||'shoelineup@gmail.com',subject='[MELLO 리뷰 요청] '+d.get('shoe'),body='요청 모델: '+d.get('shoe')+'\n\n요청 내용:\n'+d.get('reason')+'\n\n회신 이메일: '+(d.get('reply')||'미기재');location.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)});
</script></body></html>
