<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실제 러닝화 리뷰 | BALBOLL</title><link rel="stylesheet" href="/assets/runficial.css"></head><body><main class="rf-wrap"><small>BALBOLL / REAL REVIEWS</small><h1>실제 리뷰로 고르는 러닝화.</h1><p>리뷰 출처와 평가 내용을 확인하세요. 등록된 리뷰가 없는 신발은 평점을 표시하지 않습니다.</p><div id="results">리뷰 불러오는 중…</div><p><a class="rf-button" href="/request/">리뷰 요청하기 ↗</a></p></main><script src="/assets/runficial-config.js"></script><script src="/assets/runficial.js"></script><script>
(async()=>{const o=document.getElementById('results');if(!rf.ready){o.innerHTML='<p class="rf-empty">리뷰 데이터베이스 연결 전입니다. 관리자 설정을 완료하면 등록된 리뷰가 표시됩니다.</p>';return}try{const r=await rf.query('shoe_reviews?select=shoe_slug,shoe_name,source_name,source_url,review_title,summary,rating,review_date&published=eq.true&order=created_at.desc&limit=200');o.innerHTML=r.length?r.map(x=>'<article class="rf-review-card"><small>'+rf.esc(x.source_name)+' · '+rf.esc(x.review_date||'')+'</small><strong><a href="/shoes/'+encodeURIComponent(x.shoe_slug)+'/">'+rf.esc(x.shoe_name)+'</a> — '+rf.esc(x.review_title)+'</strong><p>'+rf.esc(x.summary)+'</p>'+(x.rating!==null?'<span class="rf-pill">원문 평점 '+rf.esc(x.rating)+'/5</span> ':'')+'<a target="_blank" rel="noopener noreferrer nofollow" href="'+rf.esc(x.source_url)+'">원문 보기 ↗</a></article>').join(''):'<p class="rf-empty">등록된 리뷰가 없습니다.</p>'}catch(e){o.textContent='데이터 조회 오류: '+e.message}})();
</script></body></html>
